<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WarRoom — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #f0f6ff; min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #111827; }
    .card { background: white; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); padding: 40px 36px; width: 100%; max-width: 380px; border-top: 4px solid #002366; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
    .brand-icon { font-size: 11px; font-weight: 800; letter-spacing: 0.5px; width: 36px; height: 36px; border-radius: 8px; background: #002366; color: white; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .brand-name { font-size: 22px; font-weight: 700; letter-spacing: 0.5px; color: #002366; }
    .brand-sub { font-size: 11px; color: #6b7280; font-weight: 400; letter-spacing: 1px; text-transform: uppercase; margin-top: 1px; }
    h1 { font-size: 16px; font-weight: 600; color: #374151; margin-bottom: 20px; }
    label { display: block; font-size: 13px; font-weight: 500; color: #4b5563; margin-bottom: 5px; margin-top: 14px; }
    input { width: 100%; border: 1.5px solid #e5e7eb; border-radius: 8px; padding: 9px 13px; font-size: 14px; font-family: inherit; outline: none; transition: border-color 0.15s; color: #111827; }
    input:focus { border-color: #0062cc; box-shadow: 0 0 0 3px rgba(0,98,204,0.12); }
    button[type=submit] { margin-top: 22px; width: 100%; background: #002366; color: white; border: none; border-radius: 8px; padding: 11px; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; transition: background 0.15s; }
    button[type=submit]:hover { background: #0062cc; }
    button[type=submit]:disabled { background: #7ab3e0; cursor: default; }
    #error-msg { margin-top: 14px; background: #fff5f5; border: 1px solid #fecaca; color: #dc2626; border-radius: 8px; padding: 9px 13px; font-size: 13px; display: none; }
    .hint { margin-top: 14px; font-size: 12px; color: #9ca3af; text-align: center; line-height: 1.5; }
  </style>
</head>
<body>
<div class="card">
  <div class="brand">
    <span class="brand-icon">WR</span>
    <div>
      <div class="brand-name">WarRoom</div>
      <div class="brand-sub">Bug Analysis</div>
    </div>
  </div>
  <h1>Sign in or register</h1>
  <form id="login-form">
    <label for="name-input">Name</label>
    <input id="name-input" type="text" placeholder="e.g. Alice" maxlength="50" required autocomplete="username" />
    <label for="pin-input">PIN</label>
    <input id="pin-input" type="password" placeholder="4–6 digits" maxlength="6" required autocomplete="current-password" />
    <button type="submit" id="submit-btn">Enter WarRoom</button>
  </form>
  <div id="error-msg"></div>
  <p class="hint">New name → auto-registered. Returning? Same name + PIN logs you in.</p>
</div>
<script>
  document.getElementById('login-form').onsubmit = async (e) => {
    e.preventDefault();
    const name = document.getElementById('name-input').value.trim();
    const pin = document.getElementById('pin-input').value;
    const btn = document.getElementById('submit-btn');
    const errEl = document.getElementById('error-msg');
    errEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Signing in…';

    const res = await fetch('/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, pin }),
    });
    const body = await res.json();
    if (!res.ok) {
      errEl.textContent = body.error ?? 'Something went wrong';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Enter WarRoom';
      return;
    }
    localStorage.setItem('lens_user_id', body.id);
    window.location.href = '/';
  };
</script>
</body>
</html>
