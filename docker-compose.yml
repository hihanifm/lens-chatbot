# Ports:  prod → BASE_PORT (38000)   dev → BASE_PORT+1 (38001)
# Run both simultaneously — different ports, isolated networks via project name.

services:

  # ── dev ──────────────────────────────────────────────────────────────
  app:
    profiles: ["dev"]
    build:
      context: .
      target: dev
      args:
        NODE_IMAGE: ${NODE_IMAGE:-public.ecr.aws/docker/library/node:22-bookworm-slim}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,host.docker.internal}
    ports:
      - "${DEV_PORT:-38001}:3000"
    volumes:
      - ./src:/app/src:ro
      - ./static:/app/static:ro
      - ./data/dev:/app/data
      - ./wiki:/app/wiki
      - ${USER_SKILLS_DIR:-./user-skills}:/mnt/user-skills
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      PORT: "3000"
      DATA_DIR: /app/data
      WIKI_DIR: /app/wiki
      PUBLIC_URL: "http://localhost:${DEV_PORT:-38001}"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── prod ─────────────────────────────────────────────────────────────
  app-prod:
    profiles: ["prod"]
    build:
      context: .
      target: prod
      args:
        NODE_IMAGE: ${NODE_IMAGE:-public.ecr.aws/docker/library/node:22-bookworm-slim}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,host.docker.internal}
    ports:
      - "${PROD_PORT:-38000}:3000"
    volumes:
      - ./data/prod:/app/data
      - ./wiki:/app/wiki
      - ${USER_SKILLS_DIR:-./user-skills}:/mnt/user-skills
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      PORT: "3000"
      DATA_DIR: /app/data
      WIKI_DIR: /app/wiki
      PUBLIC_URL: "http://localhost:${PROD_PORT:-38000}"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

